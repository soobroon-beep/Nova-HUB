name: Diagnóstico de avisos push
# Manual. 1) Escucha ~80 s los registros en vivo del Worker nova-hub-push (corre cada minuto).
# 2) Revisa en Firestore si hay celulares registrados y cómo están los recordatorios (solo conteos, sin datos privados).
on:
  workflow_dispatch:
    inputs:
      send_test: {description: 'Mandar una notificación de prueba a tus celulares registrados', type: boolean, default: true}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install --omit=dev
      - name: Registros en vivo del Worker (80 s)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          timeout 80 npx --yes wrangler@4 tail nova-hub-push --format json > tail.json 2>tail.err || true
          node -e "
            const L=require('fs').readFileSync('tail.json','utf8').split(/\n(?=\{)/).filter(Boolean);
            console.log('Eventos capturados:', L.length);
            for (const s of L) { try { const e=JSON.parse(s); console.log('-', e.event && e.event.cron ? 'cron '+e.event.cron : 'evento', '| resultado:', e.outcome, '| logs:', JSON.stringify((e.logs||[]).map(l=>l.message.join(' '))), '| errores:', JSON.stringify((e.exceptions||[]).map(x=>x.name+': '+x.message))); } catch(_) {} }
          "
          grep -v "^$" tail.err | tail -5 || true
      - name: Revisar Firestore
        run: node scripts/diagnose-push.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
