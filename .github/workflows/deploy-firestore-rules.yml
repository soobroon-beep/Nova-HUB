name: Publicar reglas de Firestore

# Publica firestore.rules cada vez que cambia en main (o a mano desde Actions → Run workflow).
# Usa el secreto FIREBASE_SERVICE_ACCOUNT con firebase-admin (scripts/deploy-rules.js): ya no pide el permiso
# de «probar reglas» que la cuenta de servicio no tiene (por eso fallaba con 403).

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - scripts/deploy-rules.js
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12 >/dev/null 2>&1
      - name: Publicar reglas
        run: node scripts/deploy-rules.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
