name: Publicar servidor de avisos (nova-hub-push)
# Publica worker/reminders.mjs (+ worker/briefing.mjs, el briefing de las 8:30) en tu Cloudflare como el Worker «nova-hub-push» (cron cada minuto) y le pasa
# la cuenta de servicio de Firebase (el mismo secreto FIREBASE_SERVICE_ACCOUNT que ya usan los demás flujos).
# Requiere el secreto CLOUDFLARE_API_TOKEN (plantilla «Edit Cloudflare Workers»). Sin él no hace nada.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-push-worker.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: {group: deploy-push-worker, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Pruebas del Worker
        run: node --test tests/push-worker.test.js tests/briefing.test.js
      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Falta el secreto CLOUDFLARE_API_TOKEN. No se publica nada."; exit 0; fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT."; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx --yes wrangler@4 deploy --config worker/wrangler.toml
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT --config worker/wrangler.toml
