name: Cerebro · conector de Nova Hub

# Manda a tu cerebro (Neural Brain) lo que creas, editas o borras en Nova Hub, cada 30 minutos.
# No cambia nada en la app. Usa el mismo FIREBASE_SERVICE_ACCOUNT del resto de los jobs (esa cuenta de servicio
# tiene permiso «Usuario de Cloud Datastore» en el proyecto neural-brain-148a4).

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: brain-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 400

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --omit=dev

      - name: Mandar actividad al cerebro
        run: node scripts/brain-sync.js
        env:
          BRAIN_APP: novahub
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
