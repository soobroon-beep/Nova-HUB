name: Revisar recordatorios y horario, enviar push

# Ya no corre solo: los avisos los manda el Worker «nova-hub-push» (worker/reminders.mjs) cada minuto desde Cloudflare.
# GitHub corría este cron solo unas pocas veces al día. Se deja para lanzarlo a mano si hiciera falta.
on:
  workflow_dispatch: {}

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --omit=dev

      - name: Revisar recordatorios y horario, enviar push
        run: node scripts/check-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
