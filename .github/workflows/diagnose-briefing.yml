name: Diagnóstico del briefing (titulares)
# Lánzalo a mano: muestra qué titulares devuelve el servidor (/briefing/feeds) y si las fuentes de noticias responden.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Titulares que da el servidor
        run: |
          curl -s -m 60 https://nova-hub-push.soobroon.workers.dev/briefing/feeds | python3 -c "import sys,json; d=json.load(sys.stdin); [print(k, len(v), v[:2]) for k,v in d.items()]" || true
      - name: Fuentes directas desde GitHub
        run: |
          for u in "https://news.google.com/rss?hl=es-419&gl=MX&ceid=MX:es-419" "https://www.bing.com/news/search?q=Orizaba&format=rss" "https://feeds.bbci.co.uk/mundo/rss.xml" "https://rss.dw.com/xml/rss-sp-all" "https://www.xataka.com.mx/feedburner.xml" "https://hipertextual.com/feed" "https://es.wired.com/feed/rss"; do
            echo "== $u"; curl -s -m 20 -A "Mozilla/5.0" -o /tmp/f -w "%{http_code} %{size_download}\n" "$u"; grep -o "<title>[^<]*" /tmp/f | sed -n 2,3p; done
